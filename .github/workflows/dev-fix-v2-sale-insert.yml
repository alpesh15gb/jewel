name: Fix v2 canonical sale insert

on:
  push:
    branches: [production-hardening-v2]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix placeholder count
        shell: pwsh
        run: |
          python scripts/fix_v2_sale_insert.py
          python -m compileall -q jewel_server scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jewel_server/services.py scripts/apply_production_hardening_v2.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix canonical sale insert placeholder count"
          git push origin HEAD:production-hardening-v2
