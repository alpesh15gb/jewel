name: Apply Returns UI

on:
  push:
    branches: [production-release]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Returns UI integration
        shell: pwsh
        run: |
          python scripts/apply_returns_ui.py
          python -m compileall -q jewel_client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jewel_client/main.py .github/workflows/windows-build.yml
          git diff --cached --quiet && exit 0
          git commit -m "Integrate manager Returns and Credit Notes UI"
          git push origin HEAD:production-release
