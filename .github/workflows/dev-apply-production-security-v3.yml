name: Apply production security v3

on:
  push:
    branches: [production-hardening-v3]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply HTTPS and client pinning
        shell: pwsh
        run: |
          python scripts/apply_production_security_v3.py
          python -m compileall -q jewel_client jewel_server scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit generated security source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jewel_client/main.py jewel_server/main.py installer/JewelLAN.iss
          git diff --cached --quiet && exit 0
          git commit -m "Enable pinned HTTPS for JewelLAN private LAN"
          git push origin HEAD:production-hardening-v3
