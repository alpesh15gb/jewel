name: Apply production hardening v1

on:
  push:
    branches: [production-hardening-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply production hardening
        shell: pwsh
        run: |
          python scripts/apply_production_hardening_v1.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile patched source
        shell: pwsh
        run: |
          python -m compileall -q jewel_client jewel_server jewel_tally_bridge run_client.py run_server.py run_tally_bridge.py tests scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jewel_server/db.py jewel_server/services.py jewel_server/main.py jewel_client/main.py scripts/apply_ui_redesign.py
          git diff --cached --quiet && exit 0
          git commit -m "Apply production data integrity hardening"
          git push origin HEAD:production-hardening-v1
