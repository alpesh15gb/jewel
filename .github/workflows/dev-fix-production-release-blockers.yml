name: Fix production release blockers

on:
  push:
    branches: [production-release]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded release fixes
        shell: pwsh
        run: |
          python scripts/fix_production_release_blockers.py
          python -m compileall -q jewel_server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit fixed production source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jewel_server/db.py jewel_server/services.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix atomic migration and exact credit balance path"
          git push origin HEAD:production-release
