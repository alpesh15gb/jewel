name: Apply scroll dialog fix

on:
  push:
    branches: [fix-scrollable-item-dialog]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-scrollable-item-dialog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply dialog patch
        run: python scripts/dev_apply_scroll_dialog.py
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jewel_client/main.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix clipped Save button in tall dialogs"
          git push origin HEAD:fix-scrollable-item-dialog
