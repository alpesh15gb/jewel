name: Finalize production hardening v2

on:
  push:
    branches: [production-hardening-v2]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v2 release gate
        shell: pwsh
        run: |
          python scripts/finalize_production_hardening_v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile release-gate source
        shell: pwsh
        run: |
          python -m compileall -q jewel_client jewel_server jewel_tally_bridge run_client.py run_server.py run_tally_bridge.py tests scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit release-gate changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jewel_server/main.py jewel_server/tally.py installer/JewelLAN.iss .github/workflows/windows-build.yml
          git diff --cached --quiet && exit 0
          git commit -m "Finalize v2 business dates packaging and Data Health smoke"
          git push origin HEAD:production-hardening-v2
