name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify source imports
        shell: pwsh
        run: |
          python -c "import jewel_client.main, jewel_client.api, jewel_client.config, jewel_client.scale; print(jewel_client.main.__file__)"
          python -c "import jewel_server.main, jewel_server.db, jewel_server.services; print(jewel_server.main.__file__)"

      - name: Tests
        run: pytest -q

      - name: Build server EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --name JewelServer
          --paths .
          --hidden-import jewel_server --hidden-import jewel_server.main
          --hidden-import jewel_server.db --hidden-import jewel_server.services
          --hidden-import jewel_server.security --hidden-import jewel_server.pdfs
          --hidden-import jewel_server.backup --hidden-import jewel_server.discovery
          --collect-all fastapi --collect-all pydantic --collect-all uvicorn --collect-all reportlab
          run_server.py

      - name: Build Windows client EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed --name JewelPOS
          --paths .
          --hidden-import jewel_client --hidden-import jewel_client.main
          --hidden-import jewel_client.api --hidden-import jewel_client.config
          --hidden-import jewel_client.scale
          --collect-all requests --collect-all reportlab --hidden-import serial
          run_client.py

      - name: Self-test packaged JewelPOS executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\JewelPOS.exe -ArgumentList '--self-test' -PassThru
          if (-not $p.WaitForExit(15000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'JewelPOS.exe self-test did not exit; a packaging error dialog may be blocking startup.'
          }
          if ($p.ExitCode -ne 0) { throw "JewelPOS.exe self-test failed with exit code $($p.ExitCode)" }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build JewelLAN Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) { throw "Inno Setup compiler was not found." }
          & $iscc "installer\JewelLAN.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\installer\JewelLAN-Setup.exe")) {
            throw "JewelLAN-Setup.exe was not produced."
          }

      - name: Make portable developer package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/JewelLAN-Portable | Out-Null
          Copy-Item dist/JewelServer.exe dist/JewelLAN-Portable/
          Copy-Item dist/JewelPOS.exe dist/JewelLAN-Portable/
          Copy-Item README.md dist/JewelLAN-Portable/
          Compress-Archive -Path dist/JewelLAN-Portable/* -DestinationPath dist/JewelLAN-Portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: JewelLAN-Installer
          path: dist/installer/JewelLAN-Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: JewelLAN-Portable-Developer
          path: dist/JewelLAN-Portable.zip
          if-no-files-found: error
