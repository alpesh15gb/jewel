name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest -q

      - name: Build server EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --name JewelServer
          --paths . --collect-submodules jewel_server
          --collect-all fastapi --collect-all pydantic --collect-all uvicorn --collect-all reportlab
          run_server.py

      - name: Build Windows client EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed --name JewelPOS
          --paths . --collect-submodules jewel_client
          --collect-all requests --collect-all reportlab --hidden-import serial
          run_client.py

      - name: Verify bundled application packages
        shell: pwsh
        run: |
          $client = pyinstaller-archive_viewer -l dist/JewelPOS.exe | Out-String
          if ($client -notmatch 'jewel_client\.main') { throw 'JewelPOS.exe is missing jewel_client.main' }
          if ($client -notmatch 'jewel_client\.api') { throw 'JewelPOS.exe is missing jewel_client.api' }
          $server = pyinstaller-archive_viewer -l dist/JewelServer.exe | Out-String
          if ($server -notmatch 'jewel_server\.main') { throw 'JewelServer.exe is missing jewel_server.main' }

      - name: Smoke test JewelPOS launch
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\JewelPOS.exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "JewelPOS.exe exited during launch smoke test with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build JewelLAN Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) { throw "Inno Setup compiler was not found." }
          & $iscc "installer\JewelLAN.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\installer\JewelLAN-Setup.exe")) {
            throw "JewelLAN-Setup.exe was not produced."
          }

      - name: Make portable developer package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/JewelLAN-Portable | Out-Null
          Copy-Item dist/JewelServer.exe dist/JewelLAN-Portable/
          Copy-Item dist/JewelPOS.exe dist/JewelLAN-Portable/
          Copy-Item README.md dist/JewelLAN-Portable/
          Compress-Archive -Path dist/JewelLAN-Portable/* -DestinationPath dist/JewelLAN-Portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: JewelLAN-Installer
          path: dist/installer/JewelLAN-Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: JewelLAN-Portable-Developer
          path: dist/JewelLAN-Portable.zip
          if-no-files-found: error
