name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Verify upgrade scripts are no-op on committed source
        shell: pwsh
        run: |
          python scripts/apply_tally_upgrade.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/apply_ui_redesign.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/apply_tally_xml_compat.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changes = git status --porcelain
          if ($changes) {
            Write-Host $changes
            git diff -- .
            throw "Committed source is not reproducible: an upgrade script modified the checkout. Commit the generated changes instead of mutating source in CI."
          }

      - name: Compile every Python source file
        shell: pwsh
        run: |
          python -m compileall -q jewel_client jewel_server jewel_tally_bridge run_client.py run_server.py run_tally_bridge.py tests scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify source imports
        shell: pwsh
        run: |
          python -c "import jewel_client.main, jewel_client.ui_theme, jewel_client.returns_page, jewel_client.billing_page, jewel_client.rate_panel, jewel_server.main, jewel_server.rate_management, jewel_server.returns, jewel_server.tally, jewel_server.audit_chain, jewel_server.canonical, jewel_server.integrity, jewel_server.precision, jewel_server.tls, jewel_tally_bridge.main, jewel_tally_bridge.xml_compat; print('imports ok')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test packaged client workflow
        shell: pwsh
        run: |
          @'
          import tkinter as tk
          from run_client import _install_client_enhancements
          from jewel_client.returns_page import ReturnsPage

          main_module = _install_client_enhancements()
          AdminPage = main_module.AdminPage
          App = main_module.App
          POSPage = main_module.POSPage
          TallyPage = main_module.TallyPage

          class DummyApi:
              base_url = 'https://127.0.0.1:8765'
              def get(self, path, **params):
                  if path == '/api/settings':
                      return {'settings': {'business_name': 'JewelLAN CI', 'business_timezone_offset_minutes':'330'}, 'branches': [], 'counters': []}
                  if path == '/api/dashboard':
                      return {'business_date':'2026-08-30','stock': {'c': 0, 'nw': 0.0}, 'today_sales': {'c': 0, 'total': 0.0}, 'pending_repairs': 0, 'pending_orders': 0, 'rates': [], 'categories': []}
                  if path == '/api/tally/status':
                      return {'enabled':'0','bridge_url':'http://127.0.0.1:8767','company':'','business_state_code':'','auto_create_parties':'1','mappings':{},'queue':{},'bridge':None}
                  if path == '/api/rate-management/current':
                      return {'business_date':'2026-08-30','last_rate_business_date':'2026-08-30','updated_today':True,'rates':[{'metal':'Gold','purity':'916','rate_per_gram':14550.0,'effective_at':'2026-08-30T04:00:00+00:00','source_purity':'916','derived':False,'source_rate_id':1}]}
                  if path == '/api/rate-management/settings':
                      return {'provider':'manual','ibja_token_configured':False,'goldapi_token_configured':False}
                  if path == '/api/sales': return []
                  if path == '/api/returns': return []
                  if path == '/api/customers': return []
                  if path == '/api/suppliers': return []
                  if path == '/api/karigars': return []
                  if path == '/api/purchases': return []
                  if path == '/api/repairs': return []
                  if path == '/api/orders': return []
                  if path == '/api/rates': return [{'id':1,'metal':'Gold','purity':'916','rate_per_gram':14550.0,'effective_at':'2026-08-30T04:00:00+00:00'}]
                  if path == '/api/users': return []
                  if path == '/api/integrity':
                      return {'ok':True,'sqlite_quick_check':['ok'],'foreign_key_violations':0,'issue_count':0,'audit_chain':{'ok':True},'canonical':{'ok':True,'mismatches':0},'issues':[]}
                  if path == '/api/reports/day-close':
                      return {'date':'2026-08-30','sales':{'count':0,'total':0,'payments_match_sales':True},'journal':{'balanced':True}}
                  if path == '/api/health':
                      return {'ok':True,'backup':{'ok':True,'at':'2026-08-30T00:00:00+00:00'}}
                  raise RuntimeError(f'Unexpected GUI smoke-test GET: {path}')
              def post(self, path, data):
                  if path == '/api/sales/quote':
                      return {'lines': [], 'subtotal': 0, 'discount':0, 'taxable':0, 'gst': 0, 'round_off':0, 'total': 0, 'payable': 0}
                  raise RuntimeError(f'Unexpected GUI smoke-test POST: {path}')

          root = tk.Tk(); root.withdraw()
          app = App(root, DummyApi(), {'branch_id': 1, 'counter_id': 1}, {'full_name': 'CI Administrator', 'role': 'admin', 'must_change_password': 0})
          root.update_idletasks(); assert app.winfo_exists()
          app.show(POSPage, 'Billing'); root.update_idletasks(); assert app.current_page.scan_entry.winfo_exists()
          app.show(TallyPage, 'TallyPrime'); root.update_idletasks(); assert app.current_page.winfo_exists()
          app.show(ReturnsPage, 'Returns & Credit Notes'); root.update_idletasks(); assert app.current_page.returns_tree.winfo_exists()
          app.show(AdminPage, 'Administration'); root.update_idletasks(); assert app.current_page.health_text.winfo_exists(); assert app.current_page.rate_panel.current_tree.winfo_exists()
          root.destroy()
          print('Enhanced Billing, Daily Rates, Returns, Tally and Data Health screens constructed successfully.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tests
        run: pytest -q

      - name: Build server EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --name JewelServer
          --paths .
          --hidden-import jewel_server --hidden-import jewel_server.main
          --hidden-import jewel_server.db --hidden-import jewel_server.services
          --hidden-import jewel_server.security --hidden-import jewel_server.pdfs
          --hidden-import jewel_server.backup --hidden-import jewel_server.discovery
          --hidden-import jewel_server.audit_chain --hidden-import jewel_server.canonical
          --hidden-import jewel_server.integrity --hidden-import jewel_server.precision
          --hidden-import jewel_server.returns --hidden-import jewel_server.tally --hidden-import jewel_server.tls
          --hidden-import jewel_server.rate_management
          --collect-all cryptography
          --collect-all fastapi --collect-all pydantic --collect-all uvicorn --collect-all reportlab --collect-all requests
          run_server.py

      - name: Build Windows client EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed --name JewelPOS
          --paths .
          --hidden-import jewel_client --hidden-import jewel_client.main
          --hidden-import jewel_client.api --hidden-import jewel_client.config
          --hidden-import jewel_client.scale --hidden-import jewel_client.ui_theme
          --hidden-import jewel_client.returns_page --hidden-import jewel_client.billing_page
          --hidden-import jewel_client.rate_panel
          --collect-all requests --collect-all reportlab --hidden-import serial
          run_client.py

      - name: Build Tally Bridge EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --name JewelTallyBridge
          --paths .
          --hidden-import jewel_tally_bridge --hidden-import jewel_tally_bridge.main
          --hidden-import jewel_tally_bridge.xml_compat
          --collect-all fastapi --collect-all pydantic --collect-all uvicorn --collect-all requests
          run_tally_bridge.py

      - name: Self-test packaged executables
        shell: pwsh
        run: |
          $env:JEWELLAN_DATA_DIR = "$pwd\dist\ci-data"
          & .\dist\JewelServer.exe --show-fingerprint
          if ($LASTEXITCODE -ne 0) { throw "JewelServer.exe TLS self-test failed: $LASTEXITCODE" }
          $p = Start-Process -FilePath .\dist\JewelPOS.exe -ArgumentList '--self-test' -PassThru
          if (-not $p.WaitForExit(15000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'JewelPOS.exe self-test did not exit.' }
          if ($p.ExitCode -ne 0) { throw "JewelPOS.exe self-test failed: $($p.ExitCode)" }
          $b = Start-Process -FilePath .\dist\JewelTallyBridge.exe -ArgumentList '--self-test' -PassThru -Wait
          if ($b.ExitCode -ne 0) { throw "JewelTallyBridge.exe self-test failed: $($b.ExitCode)" }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build JewelLAN Setup
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue; if ($cmd) { $iscc = $cmd.Source } }
          if (-not $iscc) { throw "Inno Setup compiler was not found." }
          & $iscc "installer\JewelLAN.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\installer\JewelLAN-Setup.exe")) { throw "JewelLAN-Setup.exe was not produced." }

      - name: Make portable developer package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/JewelLAN-Portable | Out-Null
          Copy-Item dist/JewelServer.exe dist/JewelLAN-Portable/
          Copy-Item dist/JewelPOS.exe dist/JewelLAN-Portable/
          Copy-Item dist/JewelTallyBridge.exe dist/JewelLAN-Portable/
          Copy-Item README.md dist/JewelLAN-Portable/
          Compress-Archive -Path dist/JewelLAN-Portable/* -DestinationPath dist/JewelLAN-Portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: JewelLAN-Installer
          path: dist/installer/JewelLAN-Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: JewelLAN-Portable-Developer
          path: dist/JewelLAN-Portable.zip
          if-no-files-found: error
